openapi: 3.0.3
info:
  title: DevSecOps Jira Dashboard - Email Notification Service API
  description: API specification for the report generation and email delivery endpoint (ZDAD-60)
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server
tags:
  - name: Reports
    description: Report generation and email delivery

paths:
  /api/v1/reports/generate:
    post:
      tags:
        - Reports
      summary: Generate and email reports
      description: Triggers report generation for all active specializations. The service internally evaluates each specialization's configured frequency, generates PDF reports (At-risk and Summary), uploads to cloud storage, and sends via email to configured recipients. No request body required — the cron simply triggers the endpoint.
      operationId: generateReport
      responses:
        '200':
          description: Report generation triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSuccessResponse'
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Server error (PDF generation, upload, or email delivery failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Encrypted token decrypted with private key, containing Jira email for validation

  schemas:
    BaseResponse:
      type: object
      required:
        - status_code
        - status
        - message
        - data
      properties:
        status_code:
          type: integer
        status:
          type: string
          enum: [success, failed, error]
        message:
          type: string
        data:
          description: Response data payload

    CommonServerError:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            status_code:
              example: 500
            status:
              example: "error"
            message:
              example: "An unexpected error occurred. Please try again later"
            data:
              type: array
              items: {}
              example: []

    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            status_code:
              example: 401
            status:
              example: "failed"
            message:
              example: "Authentication failed or user not found in Jira"
            data:
              type: array
              items: {}
              example: []

    ReportSuccessResponse:
      type: object
      properties:
        status_code:
          type: integer
          example: 200
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Email sent successfully"

security:
  - BearerAuth: []
