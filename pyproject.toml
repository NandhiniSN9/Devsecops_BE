[project]
name = "devsecops-overview-api"
version = "1.0.0"
description = "DevSecOps Jira Dashboard - Overview API Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.11.3",
    "pydantic-settings==2.9.1",
    "httpx==0.28.1",
    "structlog==25.1.0",
    "cryptography==44.0.3",
    "beautifulsoup4==4.13.4",
    "jinja2>=3.1.4",
    "pdfkit>=1.0.0",
    "aioboto3==13.4.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.29",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "hypothesis==6.131.15",
    "ruff==0.11.12",
    "coverage==7.8.2",
    "diff-cover==9.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*", "src/migrations/*", "src/models/__init__.py", "src/middleware/*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
